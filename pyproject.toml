[project]
name = "camoufox-autobuy"
version = "0.1.0"
description = "Production-oriented product monitoring and assisted checkout framework using Patchright and Chromium."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "aiosqlite>=0.20",
  "httpx>=0.27",
  "patchright>=1.49",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pyyaml>=6.0",
  "rich>=13.9",
  "sqlalchemy>=2.0",
  "structlog>=24.4",
  "tenacity>=9.0",
  "typer>=0.12",
]

[project.scripts]
autobuy = "autobuy.cli:app"

[dependency-groups]
dev = [
  "pyright>=1.1.390",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autobuy"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]
exclude = ["profiles", "data", "logs", "secrets"]
