name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: autobuy
          POSTGRES_USER: autobuy
          POSTGRES_PASSWORD: autobuy-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autobuy -d autobuy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      AUTOBUY_DATABASE_URL: postgresql+asyncpg://autobuy:autobuy-ci@localhost:5432/autobuy
      AUTOBUY_REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        # Alembic revision files are generated artifacts; validate application/test code formatting.
        run: uv run ruff format --check src tests alembic/env.py

      - name: Pyright
        run: uv run pyright

      - name: Migration smoke test
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Unit tests
        run: uv run pytest tests/unit --cov=autobuy --cov-report=term-missing
